<!DOCTYPE html>
<html lang="th">
<head>
<!-- CSS/JS links carry ?v=… so browsers fetch new code after an update: bump it on every code change. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ตั้งค่า — เกมฝึกความจำ</title>
<link rel="stylesheet" href="./css/home.css?v=20261113-10">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
</head>
<body>

<div class="scenery" aria-hidden="true">
  <div class="sun"></div>
  <div class="hill hill-far"></div>
  <div class="hill hill-near"></div>
</div>

<div class="app">

  <header class="hero">
    <h1 id="settingsTitle">ตั้งค่า</h1>
    <p id="settingsSubtitle">ปรับเกมให้เหมาะกับคุณ</p>
  </header>

  <main class="card-panel">

    <section class="setting">
      <div class="setting-head">
        <span class="setting-icon" aria-hidden="true">🌐</span>
        <div>
          <h2 id="languageLabel">ภาษา</h2>
          <p id="languageDesc">เลือกภาษาที่ใช้ในเกม</p>
        </div>
      </div>

      <div class="segmented" role="radiogroup" aria-labelledby="languageLabel">
        <button type="button" role="radio" data-lang="th" aria-checked="false">ไทย</button>
        <button type="button" role="radio" data-lang="en" aria-checked="false">English</button>
      </div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item" type="button" id="navHomeBtn">
        <span class="nav-icon">🏠</span>
        <span id="navHome">หน้าหลัก</span>
      </button>
      <button class="nav-item active" type="button" aria-current="page">
        <span class="nav-icon">⚙️</span>
        <span id="navSettings">ตั้งค่า</span>
      </button>
      <button class="nav-item" type="button" id="navAdminBtn">
        <span class="nav-icon">🔐</span>
        <span id="navAdmin">แอดมิน</span>
      </button>
    </nav>
  </main>
</div>

<script src="./js/lang.js?v=20261113-10"></script>
<script>
  const settingsTranslations = {
    th: {
      settingsTitle: "ตั้งค่า",
      settingsSubtitle: "ปรับเกมให้เหมาะกับคุณ",
      languageLabel: "ภาษา",
      languageDesc: "เลือกภาษาที่ใช้ในเกม",
      navHome: "หน้าหลัก",
      navSettings: "ตั้งค่า",
      navAdmin: "แอดมิน"
    },
    en: {
      settingsTitle: "Settings",
      settingsSubtitle: "Make the game yours",
      languageLabel: "Language",
      languageDesc: "Choose the language used in the game",
      navHome: "Home",
      navSettings: "Settings",
      navAdmin: "Admin"
    }
  };

  const langButtons = document.querySelectorAll(".segmented [data-lang]");

  // Repaints text + the selected language button. Never calls setAppLang,
  // so the cross-tab listener below can't loop.
  function applySettingsLang(lang) {
    const t = settingsTranslations[lang] || settingsTranslations.th;
    Object.keys(t).forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.textContent = t[id];
    });
    langButtons.forEach(function (btn) {
      btn.setAttribute("aria-checked", btn.dataset.lang === lang ? "true" : "false");
    });
  }

  // Uses the app-wide language key from lang.js, so this always matches
  // whatever was picked on any other page.
  applySettingsLang(getAppLang());

  langButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      applySettingsLang(setAppLang(btn.dataset.lang));
    });
  });

  window.addEventListener(APP_LANG_EVENT, function (e) {
    applySettingsLang(e.detail);
  });

  document.getElementById("navHomeBtn").addEventListener("click", function () {
    window.location.href = "./index.html";
  });
  document.getElementById("navAdminBtn").addEventListener("click", function () {
    window.location.href = "./admin.html";
  });
</script>

</body>
</html>
